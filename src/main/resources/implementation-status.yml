working-scope-added:
- Assassin's 4-branch skill tree with combat/stealth/defense hooks
- TNT owner-binding, restoration, 4-second use cooldown and display name
- Additional starter kits for previously empty classes
- Advancement reward removed; kill reward 2 points with 24-hour pair restriction and 10-minute global interval
- Guardian shield critical-axe stun and ordinary axe disable resistance
- Engineer targeting from correct machine center, hostile-mob fallback and deployment scanning
- XP-funded passive trusted-player Infuser mending retained
- Additional purchasable passives with event handlers
- Tooltips with wrapped descriptions and exact ability configuration values
known-gaps:
- This is a multiplayer candidate build, not the fully completed plugin.
- 26 draft passives remain unavailable and should not consume points.
- Some legacy enabled passives use provisional balance or simplified approximations.
- Many abilities still share base handler types; six distinct finalized class-specific abilities are not assured.
- No resource-pack-level 3D turret rendering or region protection integration.
- Protected-region and duplication regression tests remain required.
- A successful GitHub Actions compilation and multiplayer playtest are required.
